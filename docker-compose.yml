version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: quizqueya-db
    environment:
      POSTGRES_DB: quizqueya
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: quizqueya-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: quizqueya
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: cambia-esta-clave-en-produccion
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: "*"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quizqueya-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
